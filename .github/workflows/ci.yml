name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - run: bun install --frozen-lockfile
      - name: Render the pending changelog without modifying files
        run: uvx --from towncrier==26.9.0 towncrier build --draft --version 0.0.0
      - name: Validate the changelog contribution on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          base="origin/$BASE_REF"
          if git cat-file -e "$base:CHANGELOG.md" 2> /dev/null && \
             [[ "$HEAD_REF" != release/v* ]] && \
             git diff --name-only "$base"...HEAD | grep --fixed-strings --line-regexp --quiet CHANGELOG.md; then
            echo "Ordinary pull requests must add changelog.d fragments instead of editing CHANGELOG.md." >&2
            exit 1
          fi
          uvx --from towncrier==26.9.0 towncrier check --compare-with "$base"
      - name: Validate a compiled release changelog
        if: startsWith(github.ref, 'refs/heads/release/v') || startsWith(github.head_ref, 'release/v')
        run: |
          tag="v$(node --print "require('./package.json').version")"
          bun scripts/release.ts validate-changelog --tag "$tag" > /dev/null
      - run: bun run typecheck
      - run: bun test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: bun run build
      - run: bun run build:site
      - run: bun run check:dist
      - name: Install WebKit and system dependencies
        run: bunx playwright install --with-deps webkit
      - name: Test the packed package in WebKit
        run: bun run check:browser
        timeout-minutes: 10
      - name: Test the public preview in WebKit
        run: bun run check:site
        timeout-minutes: 5
      - run: git diff --exit-code
      - name: Upload packed browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packed-browser-evidence
          path: |
            output/playwright/packed-*/report.json
            output/playwright/packed-*/host-report.json
            output/playwright/packed-*/search-report.json
            output/playwright/packed-*/lineage*-report.json
            output/playwright/packed-*/*.tgz
            output/playwright/packed-*/*.png
            output/playwright/site-*/report.json
            output/playwright/site-*/*.png
          if-no-files-found: ignore
          retention-days: 14
