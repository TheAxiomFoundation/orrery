name: Prepare release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require the default branch
        if: github.ref != 'refs/heads/main'
        run: .github/scripts/prepare-release/require-main.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Resolve the next version and compile the changelog
        id: release
        run: .github/scripts/prepare-release/compile-changelog.sh
      - name: Create the release branch and commit
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/prepare-release/create-branch.sh
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INCREMENT: ${{ steps.release.outputs.increment }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/prepare-release/open-pull-request.sh
