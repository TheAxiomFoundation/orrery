name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'changelog.d/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: orrery-release
  cancel-in-progress: false

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      asset: ${{ steps.release.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Update the version and changelog
        id: release
        run: .github/scripts/release/prepare.sh

  publish:
    needs: versioning
    if: needs.versioning.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.versioning.outputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the reviewed npm client
        run: npm install --global npm@11.5.1
      - name: Require the generated release commit
        env:
          EXPECTED_SHA: ${{ needs.versioning.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.versioning.outputs.tag }}
        run: .github/scripts/release/require-main-commit.sh
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: bun run build
      - run: bun run check:dist
      - name: Pack and validate the public archive
        env:
          RELEASE_TAG: ${{ needs.versioning.outputs.tag }}
          RELEASE_ASSET: ${{ needs.versioning.outputs.asset }}
        run: .github/scripts/release/pack.sh
      - uses: actions/upload-artifact@v7
        with:
          name: orrery-${{ needs.versioning.outputs.version }}
          path: |
            release/${{ needs.versioning.outputs.asset }}
            release/SHA256SUMS
          if-no-files-found: error
      - name: Create or verify the annotated version tag
        env:
          EXPECTED_SHA: ${{ needs.versioning.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.versioning.outputs.tag }}
          RELEASE_VERSION: ${{ needs.versioning.outputs.version }}
        run: .github/scripts/release/tag.sh
      - name: Publish or verify the npm package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.versioning.outputs.name }}
          PACKAGE_VERSION: ${{ needs.versioning.outputs.version }}
          NPM_TAG: ${{ needs.versioning.outputs.npm_tag }}
          RELEASE_ASSET: ${{ needs.versioning.outputs.asset }}
        run: .github/scripts/release/publish-npm.sh
      - name: Create or verify the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.versioning.outputs.tag }}
          RELEASE_VERSION: ${{ needs.versioning.outputs.version }}
          RELEASE_ASSET: ${{ needs.versioning.outputs.asset }}
          PRERELEASE: ${{ needs.versioning.outputs.prerelease }}
        run: .github/scripts/release/publish-github.sh
