name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Create the version tag and publish after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: orrery-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the reviewed npm client
        run: npm install --global npm@11.5.1
      - name: Resolve and validate release identity
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: .github/scripts/release/resolve.sh
      - name: Require a publishable commit from main
        if: steps.release.outputs.publish == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: .github/scripts/release/require-main-commit.sh
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: bun run build
      - run: bun run check:dist
      - name: Pack and validate the public archive
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: .github/scripts/release/pack.sh
      - uses: actions/upload-artifact@v7
        with:
          name: orrery-${{ steps.release.outputs.version }}
          path: |
            release/${{ steps.release.outputs.asset }}
            release/SHA256SUMS
          if-no-files-found: error
      - name: Create or verify the annotated version tag
        if: steps.release.outputs.publish == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/release/tag.sh
      - name: Publish or verify the npm package
        if: steps.release.outputs.publish == 'true'
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: .github/scripts/release/publish-npm.sh
      - name: Create or verify the GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: .github/scripts/release/publish-github.sh
