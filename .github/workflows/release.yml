name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'changelog.d/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: orrery-release
  cancel-in-progress: false

jobs:
  Versioning:
    if: github.event.head_commit.message != 'Update package version'
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Bump version and build changelog
        run: .github/scripts/release/build-changelog.sh
      - name: Update package version
        id: commit
        uses: EndBug/add-and-commit@v10
        with:
          add: '.'
          message: Update package version

  Publish:
    needs: Versioning
    if: needs.Versioning.outputs.committed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the reviewed npm client
        run: npm install --global npm@11.5.1
      - name: Read generated release metadata
        id: release
        run: .github/scripts/release/capture-metadata.sh
      - name: Require the generated release commit
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.commit_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: .github/scripts/release/require-main-commit.sh
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: bun run build
      - run: bun run check:dist
      - name: Pack and validate the public archive
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: .github/scripts/release/pack.sh
      - uses: actions/upload-artifact@v7
        with:
          name: orrery-${{ steps.release.outputs.version }}
          path: |
            release/${{ steps.release.outputs.asset }}
            release/SHA256SUMS
          if-no-files-found: error
      - name: Create or verify the annotated version tag
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.commit_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/release/tag.sh
      - name: Publish or verify the npm package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: .github/scripts/release/publish-npm.sh
      - name: Create or verify the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: .github/scripts/release/publish-github.sh
