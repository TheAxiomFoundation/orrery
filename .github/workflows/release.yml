name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the reviewed npm client
        run: npm install --global npm@11.5.1
      - name: Resolve and validate release identity
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="v$(node --print "require('./package.json').version")"
          fi
          metadata=$(bun scripts/release.ts metadata --tag "$tag")
          {
            echo "tag=$(jq --raw-output .tag <<<"$metadata")"
            echo "name=$(jq --raw-output .name <<<"$metadata")"
            echo "version=$(jq --raw-output .version <<<"$metadata")"
            echo "npm_tag=$(jq --raw-output .npmTag <<<"$metadata")"
            echo "prerelease=$(jq --raw-output .prerelease <<<"$metadata")"
            echo "asset=$(jq --raw-output .assetName <<<"$metadata")"
          } >> "$GITHUB_OUTPUT"
      - name: Require a tagged commit from main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: bun run build
      - run: bun run check:dist
      - name: Pack and validate the public archive
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          mkdir release
          npm pack --json --pack-destination release > release/pack.json
          bun scripts/release.ts validate-pack \
            --tag "$RELEASE_TAG" \
            --pack-json release/pack.json > release/validated.json
          cd release
          sha256sum "$RELEASE_ASSET" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: orrery-${{ steps.release.outputs.version }}
          path: |
            release/${{ steps.release.outputs.asset }}
            release/SHA256SUMS
          if-no-files-found: error
      - name: Publish or verify the npm package
        if: github.event_name == 'push'
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          set +e
          npm view "$PACKAGE_NAME" versions --json > registry-versions.json 2> registry-list.error
          list_status=$?
          npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity --json > registry-version.json 2> registry-direct.error
          direct_status=$?
          set -e

          listed=false
          if [ "$list_status" -eq 0 ]; then
            listed=$(jq --arg version "$PACKAGE_VERSION" \
              'if type == "array" then index($version) != null else . == $version end' \
              registry-versions.json)
          elif ! grep --quiet 'E404' registry-list.error; then
            cat registry-list.error
            exit 1
          fi

          if [ "$direct_status" -eq 0 ]; then
            if [ "$listed" != true ]; then
              echo "npm list and exact-version lookup disagree" >&2
              exit 1
            fi
            published_integrity=$(jq --raw-output . registry-version.json)
            local_integrity=$(jq --raw-output .integrity release/validated.json)
            if [ "$published_integrity" != "$local_integrity" ]; then
              echo "published npm archive differs from the locally built archive" >&2
              exit 1
            fi
          else
            if ! grep --quiet 'E404' registry-direct.error; then
              cat registry-direct.error
              exit 1
            fi
            if [ "$listed" = true ]; then
              echo "npm list and exact-version lookup disagree" >&2
              exit 1
            fi
            npm publish "release/$RELEASE_ASSET" \
              --access public \
              --tag "$NPM_TAG" \
              --provenance
          fi
      - name: Create or verify the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > all-release-pages.json
          listed_id=$(jq --raw-output --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag) | .id] | if length == 0 then "" elif length == 1 then .[0] else error("duplicate release tags") end' \
            all-release-pages.json)

          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > exact-release.json 2> exact-release.error
          direct_status=$?
          set -e

          if [ "$direct_status" -eq 0 ]; then
            direct_id=$(jq --raw-output .id exact-release.json)
            if [ "$listed_id" != "$direct_id" ]; then
              echo "GitHub release list and exact-tag lookup disagree" >&2
              exit 1
            fi
            actual_prerelease=$(jq --raw-output .prerelease exact-release.json)
            if [ "$actual_prerelease" != "$PRERELEASE" ]; then
              echo "existing GitHub release has the wrong prerelease status" >&2
              exit 1
            fi
            archive_sha=$(sha256sum "release/$RELEASE_ASSET" | cut -d' ' -f1)
            sums_sha=$(sha256sum release/SHA256SUMS | cut -d' ' -f1)
            jq --exit-status \
              --arg archive "$RELEASE_ASSET" \
              --arg archive_digest "sha256:$archive_sha" \
              --arg sums_digest "sha256:$sums_sha" \
              '(.assets | map(select(.name == $archive and .digest == $archive_digest)) | length == 1) and
               (.assets | map(select(.name == "SHA256SUMS" and .digest == $sums_digest)) | length == 1)' \
              exact-release.json > /dev/null
          else
            if [ -n "$listed_id" ]; then
              echo "GitHub release list and exact-tag lookup disagree" >&2
              exit 1
            fi
            if ! grep --quiet 'HTTP 404' exact-release.error; then
              cat exact-release.error
              exit 1
            fi
            args=(
              "$RELEASE_TAG"
              "release/$RELEASE_ASSET"
              "release/SHA256SUMS"
              --title "Orrery $RELEASE_VERSION"
              --generate-notes
              --verify-tag
            )
            if [ "$PRERELEASE" = true ]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
